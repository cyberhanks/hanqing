name: Monthly Report & Phase 4

on:
  schedule:
    - cron: '0 2 1 * *'   # 每月1日 02:00 UTC (台灣時間 10:00)
  workflow_dispatch:       # 允許手動觸發

jobs:
  phase4:
    name: Phase 4 – Stats, Rankings & Monthly Report
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run Phase 3 scoring update
        working-directory: pipeline
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
        run: python run_phase3.py

      - name: Run Phase 4 monthly report
        working-directory: pipeline
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY:            ${{ secrets.RESEND_API_KEY }}
        run: python run_phase4.py

      - name: Trigger Vercel revalidation
        if: success()
        run: |
          curl -s -X POST "${{ secrets.VERCEL_REVALIDATE_URL }}" \
            -H "x-revalidate-token: ${{ secrets.VERCEL_REVALIDATE_TOKEN }}" || true
